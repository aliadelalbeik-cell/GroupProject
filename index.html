<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Our Cloud Project</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 600px;
        }
        h1 {
            color: #764ba2;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #555;
        }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #5a6fd6;
        }
        .group-info {
            margin-top: 30px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>☁️ Welcome to Our Cloud Project</h1>
        <p>
            We are <strong>Group 2</strong>. This project demonstrates cloud hosting using GitHub Pages.
            Below you can find the link to our shared Google Drive folder containing all project files.
        </p>
        <a href="https://drive.google.com/drive/folders/1TvSNgeIJ-JLS3TJhPqUe-LYIfvDmMrRc" target="_blank" class="btn">
            📂 Access Our Google Drive Folder
        </a>
        <div class="group-info">
            <p>DMD243 - Cloud Computing and Embedded Systems</p>
            <p>Group 2</p>
        </div>
    </div>
</body>
</html>
